<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="elsamee3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="elsamee3-wave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <path d="M32 6L11 15V29C11 44.5 20 54 32 58C44 54 53 44.5 53 29V15L32 6Z" 
        fill="url(#elsamee3-grad)" opacity="0.15" />
  <path d="M32 8L13 16.5V29C13 43 21.2 51.8 32 55.5C42.8 51.8 51 43 51 29V16.5L32 8Z" 
        stroke="url(#elsamee3-grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Acoustic Frequency Wave Bars (Representing Hearing / Fingerprint) -->
  <rect x="20" y="27" width="3.5" height="10" rx="1.75" fill="url(#elsamee3-wave)" />
  <rect x="26" y="21" width="3.5" height="22" rx="1.75" fill="#38bdf8" />
  <rect x="32" y="16" width="4" height="32" rx="2" fill="#ffffff" filter="url(#glow)" />
  <rect x="38.5" y="21" width="3.5" height="22" rx="1.75" fill="#818cf8" />
  <rect x="44.5" y="27" width="3.5" height="10" rx="1.75" fill="url(#elsamee3-wave)" />

  <!-- Central Acoustic Core Point -->
  <circle cx="34" cy="32" r="2.2" fill="#06b6d4" />
</svg>
