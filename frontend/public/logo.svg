<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logo-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="logo-wave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(6, 4)">
    <rect width="56" height="56" rx="15" fill="#0f172a" />
    <path d="M28 6L9 14.5V26.5C9 40 17.5 48.5 28 52C38.5 48.5 47 40 47 26.5V14.5L28 6Z" 
          fill="url(#logo-shield-grad)" opacity="0.2" />
    <path d="M28 8L11 15.5V26.5C11 38.5 18.5 46.5 28 49.5C37.5 46.5 45 38.5 45 26.5V15.5L28 8Z" 
          stroke="url(#logo-shield-grad)" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Acoustic Frequency Bars -->
    <rect x="17.5" y="24.5" width="3" height="9" rx="1.5" fill="url(#logo-wave)" />
    <rect x="23" y="19" width="3" height="20" rx="1.5" fill="#38bdf8" />
    <rect x="28.5" y="14.5" width="3.5" height="29" rx="1.75" fill="#ffffff" filter="url(#logo-glow)" />
    <rect x="34.5" y="19" width="3" height="20" rx="1.5" fill="#818cf8" />
    <rect x="40" y="24.5" width="3" height="9" rx="1.5" fill="url(#logo-wave)" />
  </g>

  <!-- Typography: Arabic Title -->
  <text x="74" y="31" font-family="'Noto Sans Arabic', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.3">السميع</text>
  
  <!-- Typography: Latin Title -->
  <text x="145" y="30" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#2563eb" letter-spacing="-0.5">elsamee3</text>

  <!-- Tagline / Subtitle -->
  <text x="75" y="47" font-family="'Noto Sans Arabic', 'Inter', system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#64748b" letter-spacing="0.2">خزنة الملكية الفكرية والبصمة الصوتية • COPYRIGHT VAULT</text>
  
  <!-- Subtle Dot separator -->
  <circle cx="137" cy="25" r="2.5" fill="#06b6d4" />
</svg>
